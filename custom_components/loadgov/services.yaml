set_profile:
  fields:
    profile:
      required: true
      example: silent
      selector:
        select:
          options: [silent, balanced, boost, drain]
    until:
      example: "07:00 Europe/Berlin"
      selector:
        text:
    ttl:
      example: "2h"
      selector:
        text:
    reason:
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: loadgov

set_ceiling:
  fields:
    profile:
      required: true
      example: silent
      selector:
        select:
          options: [silent, balanced, boost, drain]
    until:
      example: "23:30 Europe/Berlin"
      selector:
        text:
    ttl:
      example: "30m"
      selector:
        text:
    reason:
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: loadgov

clear_ceiling:
  fields:
    reason:
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: loadgov

kill_stray:
  fields:
    pid:
      required: true
      example: 12345
      selector:
        number:
          min: 1
          max: 4194304
          mode: box
    start_time:
      required: true
      example: 987654321
      selector:
        number:
          min: 0
          max: 9007199254740991
          mode: box
    reason:
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: loadgov

image_run_now:
  fields:
    id:
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 9007199254740991
          mode: box
    reason:
      required: true
      example: "release is needed before the window"
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: loadgov
