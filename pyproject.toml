[project]
name = "loadgov"
version = "0.0.1"
description = "Host-wide load governor: CPU/fan throttling, RAM/swap guard, slot arbiter, Home Assistant bridge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[project.urls]
Homepage = "https://github.com/mleibetseder/loadgov"
Issues = "https://github.com/mleibetseder/loadgov/issues"

[project.scripts]
loadgovd = "loadgov.daemon.main:main"
loadctl = "loadgov.cli.loadctl:main"
loadgov-mcp = "loadgov.mcp.server:main"

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loadgov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["legacy", "ha", "custom_components"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "SIM115"]
