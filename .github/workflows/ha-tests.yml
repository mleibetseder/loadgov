name: ha-tests

# The Home Assistant integration has its own uv project (ha/pyproject.toml): the daemon's stdlib-only
# runtime and its ci.yml job never install Home Assistant.
on:
  push:
    branches: [main]
    paths: ["ha/**", "custom_components/**", ".github/workflows/ha-tests.yml"]
  pull_request:
    paths: ["ha/**", "custom_components/**", ".github/workflows/ha-tests.yml"]

concurrency:
  group: ha-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ha:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ha
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --locked
      - run: uv run ruff check . ../custom_components
      - run: uv run ruff format --check . ../custom_components
      - run: uv run pytest -q
