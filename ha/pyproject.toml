# Test environment of the Home Assistant custom integration. Separate from the daemon's project on purpose:
# the daemon is stdlib-only and its CI job must not pull in Home Assistant.
[project]
name = "loadgov-ha-tests"
version = "0.0.1"
description = "Tests of the loadgov custom integration (not installed in Home Assistant)"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    # 0.13.375 pins homeassistant==2026.10.4 (the HA release line the tests pin)
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py314"
src = [".", ".."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
