# Dashboard view for the "Build Host Load Governor" device (custom integration loadgov, HA 2026.10).
# DRAFT: not applied to any Home Assistant instance. Paste into a dashboard's raw configuration editor, or
# keep as a YAML-mode dashboard. Entity ids are fixed by the integration (host_<key>).
title: Build Host
views:
  - title: Load Governor
    path: loadgov
    icon: mdi:server
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Control
            icon: mdi:tune
          - type: tile
            entity: select.host_load_profile
            name: Profile
            features:
              - type: select-options
          - type: tile
            entity: switch.host_load_gate_hold
            name: Hold new work
            icon: mdi:hand-back-left
            features:
              - type: toggle
          - type: tile
            entity: switch.host_instant_quiet_freeze
            name: Instant quiet (freeze)
            icon: mdi:snowflake
            vertical: false
          - type: tile
            entity: button.host_resume_paused_workers
            name: Resume paused workers
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.host_resume_paused_workers
              confirmation:
                text: Resume all paused workers?
          - type: tile
            entity: button.host_kill_build_daemons
            name: Kill build daemons
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.host_kill_build_daemons
              confirmation:
                text: Stop idle Gradle and Kotlin daemons?
      - type: grid
        cards:
          - type: heading
            heading: Limits
            icon: mdi:speedometer
          - type: tile
            entity: number.host_max_cores
            name: Max cores
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.host_target_cpu_pct
            name: Target CPU
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.host_load_max
            name: Load max
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.host_max_implementers
            name: Max implementers
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.host_max_light
            name: Max light jobs
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.host_ram_floor_gb
            name: RAM floor
            features:
              - type: numeric-input
                style: buttons
      - type: grid
        cards:
          - type: heading
            heading: State
            icon: mdi:chart-line
          - type: tile
            entity: sensor.host_effective_profile
            name: Effective profile
          - type: tile
            entity: sensor.host_owner_ceiling
            name: Owner ceiling
          - type: tile
            entity: sensor.host_heavy_holder
            name: Heavy slot holder
          - type: tile
            entity: binary_sensor.host_restriction_active
            name: Restriction
          - type: tile
            entity: binary_sensor.host_hold_active
            name: Hold
          - type: tile
            entity: binary_sensor.host_workers_paused
            name: Workers paused
          - type: tile
            entity: sensor.host_paused_workers
            name: Paused count
      - type: grid
        cards:
          - type: heading
            heading: Load
            icon: mdi:cpu-64-bit
          - type: tile
            entity: sensor.host_busy_pct
            name: Busy
          - type: tile
            entity: sensor.host_cap_cores_build_work
            name: Cap build-work.slice
          - type: tile
            entity: sensor.host_cap_cores_mirror
            name: Cap mirrored cgroup
          - type: tile
            entity: sensor.host_memory_available
            name: Memory available
          - type: tile
            entity: sensor.host_swap_used
            name: Swap used
          - type: history-graph
            title: Pressure (avg60)
            hours_to_show: 6
            entities:
              - sensor.host_cpu_pressure
              - sensor.host_memory_pressure
              - sensor.host_io_pressure
      - type: grid
        cards:
          - type: heading
            heading: Queue
            icon: mdi:format-list-numbered
          - type: tile
            entity: sensor.host_level
            name: Host level
          - type: tile
            entity: sensor.host_load_1min
            name: Load 1 min
          - type: tile
            entity: sensor.host_load_5min
            name: Load 5 min
          - type: tile
            entity: sensor.host_load_per_core
            name: Load per core
          - type: tile
            entity: sensor.host_light_lane
            name: Light lane
          - type: tile
            entity: sensor.host_disk_used
            name: Disk used
          - type: tile
            entity: sensor.host_heavy_slot_holder_eta
            name: Heavy slot free at (est.)
          - type: tile
            entity: sensor.host_compile_slot_holder_eta
            name: Compile slot free at (est.)
          - type: markdown
            title: Running and next
            content: |-
              {% set jobs = state_attr('sensor.host_running_jobs', 'jobs') or [] %}
              **Running ({{ states('sensor.host_running_jobs') }})**

              {% for j in jobs -%}
              - {{ j.kind }} {{ j.project }}: {% if j.url %}[{{ j.key }}]({{ j.url }}){% else %}{{ j.key or j.label }}{% endif %}
              {%- if j.slot %} ({{ j.slot }} slot){% endif %}
              {%- if j.eta %}, done ~ {{ as_timestamp(j.eta, none) | timestamp_custom('%H:%M', true, '?') }}{% if j.overdue %} (overdue){% endif %}{% endif %}
              {% else -%}
              - nothing
              {% endfor %}
              {% for slot in ['heavy', 'compile'] %}
              {% set e = 'sensor.host_' ~ slot ~ '_slot_next' %}
              {% set q = state_attr(e, 'queue') %}
              **Next in the {{ slot }} slot ({{ state_attr(e, 'count') or 0 }})**

              {% for w in q or [] -%}
              {{ w.position }}. {% if w.url %}[{{ w.key }}]({{ w.url }}){% else %}{{ w.key or w.label }}{% endif %} ({{ w.project }}, waiting {{ ((w.wait_s or 0) / 60) | round(0) | int }} min
              {%- if w.eta %}, starts ~ {{ as_timestamp(w.eta, none) | timestamp_custom('%H:%M', true, '?') }}{% endif %})
              {% else -%}
              - empty
              {% endfor %}
              {% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: Image train
            icon: mdi:train
          - type: tile
            entity: sensor.host_image_train_next_start
            name: Image train next start
          - type: tile
            entity: sensor.host_image_train
            name: Image train queued
          - type: markdown
            title: Image train queue
            content: |-
              {% set e = 'sensor.host_image_train' %}
              {% set q = state_attr(e, 'queue') or [] %}
              Window {{ state_attr(e, 'window') or '?' }} ({{ state_attr(e, 'timezone') or '?' }}), {{ 'open now' if state_attr(e, 'in_window') else 'closed' }}.

              {% for j in q -%}
              {{ j.position }}. {% if j.url %}[{{ j.key or j.label }}]({{ j.url }}){% else %}{{ j.key or j.label }}{% endif %} ({{ j.project }}, {{ j.channel }}, {{ j.state }})
              {%- if j.planned_start %}, starts ~ {{ as_timestamp(j.planned_start, none) | timestamp_custom('%H:%M', true, '?') }}{% endif %}
              {% else -%}
              - empty
              {% endfor %}
          - type: markdown
            content: |-
              To run a queued job now, outside the window: Developer tools, Actions, `loadgov.image_run_now` with the job `id` (shown in the sensor's `queue` attribute) and a `reason`. The daemon audits it as an owner action.
      - type: grid
        cards:
          - type: heading
            heading: Projects
            icon: mdi:folder-multiple
          # One CPU and one memory sensor per project, created when the project first shows up in the
          # status: sensor.host_project_<project>_cpu / _memory. These two are placeholders for a project
          # named "web-app"; add a pair per project you use.
          - type: tile
            entity: sensor.host_project_web_app_cpu
            name: web-app CPU
          - type: tile
            entity: sensor.host_project_web_app_memory
            name: web-app memory
          - type: history-graph
            title: Compute per project (cores)
            hours_to_show: 6
            entities:
              - sensor.host_project_web_app_cpu
      - type: grid
        cards:
          - type: heading
            heading: Diagnostics
            icon: mdi:stethoscope
          - type: tile
            entity: sensor.host_daemon_features
            name: Daemon features
