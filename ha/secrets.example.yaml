# Placeholders only. Add these keys to the real /config/secrets.yaml on the HA host. Never commit real values.
#
# loadgov_token: the REST bearer token in raw form. It is the value of LOADGOV_REST_TOKEN in
#   /etc/loadgov/tokens.env on the loadgov host (packaging/config/tokens.env.example).
#   Not referenced by the YAML directly (YAML cannot concatenate "Bearer " + a secret); it is the single
#   source you copy from when you build loadgov_auth_header below.
loadgov_token: replace-with-the-generated-token

# loadgov_auth_header: the literal HTTP header value used by the rest_command and the rest sensor:
#   "Bearer " followed by loadgov_token.
loadgov_auth_header: "Bearer replace-with-the-generated-token"

# loadgov_webhook_id: the webhook id of the alert automation. Same value as LOADGOV_HA_WEBHOOK_ID in
#   /etc/loadgov/tokens.env and as webhook_id in ha/automations/loadgov_alerts.yaml. A webhook trigger
#   in a UI automation cannot read !secret, so the id is pasted there once (see ha/README.md).
loadgov_webhook_id: loadgov-alert-replace-with-the-generated-id
